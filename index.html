<style>
:root{
  --deep:#0b2f57;
  --deep2:#072443;
  --card:rgba(11,52,96,.80);
  --card-solid:#0d3a68;
  --line:rgba(150,205,240,.42);
  --line-soft:rgba(150,205,240,.16);
  --text:#ffffff;
  --muted:rgba(255,255,255,.62);
  --faint:rgba(255,255,255,.34);
  --private:#F7CF4A;
  --work:#B4DB4E;
  --sleep:#C9EBFF;
  --gold:#E5BB67;
  --navy:#1d4b78;
  --danger:#ff8f8f;
  --r:18px;
  --pad:16px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --ja:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
html{background:var(--deep2)}
body{
  min-height:100%;
  color:var(--text);font-family:var(--ja);
  background:linear-gradient(180deg,#2f7fbf 0px,#185692 340px,#0d3c6c 620px,#082a4d 1100px,#072443 100%);
  background-attachment:scroll;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sleep);outline-offset:2px}
.app{max-width:520px;margin:0 auto;position:relative;min-height:100%;height:100%}
.view{display:none}
.view.active{display:block}
#v-home.active{display:flex;flex-direction:column;height:100%;overflow:hidden}
@media (max-height:540px){#v-home.active{height:auto;min-height:100vh;overflow:visible}#v-home .cards{min-height:520px}}

.hero::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:48px;
  background:linear-gradient(180deg,rgba(38,118,182,0) 0%,#2676b6 100%);
  pointer-events:none;
}
.version{
  position:absolute;top:calc(var(--safe-t) + 12px);right:12px;z-index:2;
  display:flex;align-items:center;gap:2px;
  font-family:var(--sans);font-size:11px;letter-spacing:.06em;color:rgba(29,75,120,.62);
  padding:6px 6px;min-height:32px;border-radius:16px;
}
.version svg{width:14px;height:14px;opacity:.7}
.brand{position:relative;z-index:1}
.brand h1{
  margin:0;font-family:var(--sans);font-weight:300;
  font-size:clamp(36px,11.5vw,52px);letter-spacing:.32em;line-height:1;color:var(--navy);
  margin-right:-.32em;
}
.brand .sub{
  margin:10px 0 0;font-family:var(--mincho);font-weight:500;
  font-size:clamp(12px,3.6vw,14px);letter-spacing:.3em;color:#24527f;
}
.brand .rule{width:34px;height:2px;background:var(--gold);margin:12px 0 0;border-radius:1px}
.quote{
  margin:12px 0 0;font-family:var(--mincho);font-weight:500;
  color:#1b456f;font-size:13.5px;line-height:1.75;letter-spacing:.04em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  max-width:30em;word-break:normal;overflow-wrap:anywhere;
  text-shadow:0 0 12px rgba(255,255,255,.55);
}
.quote.long,.quote.xlong{font-size:12.5px;line-height:1.7}
.quote.clamped{cursor:pointer}
.quote-full{font-family:var(--mincho);font-size:15px;line-height:1.95;letter-spacing:.04em;padding:6px 10px 14px;white-space:pre-wrap}

/* ---------- Cards ---------- */
.cards{position:relative;z-index:1;flex:1;min-height:0;margin-top:-42px;gap:12px !important;background:linear-gradient(180deg,transparent 0,transparent 40px,#2676b6 40px,#164f8a 260px,#0c3a69 520px,#072443 900px);padding:0 var(--pad) calc(var(--safe-b) + 76px);display:flex;flex-direction:column;gap:10px}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  overflow:hidden;display:flex;flex-direction:column;min-height:0;
}
#cardMood,#cardSleep{flex:1 1 0}
.card-head{flex:none;display:flex;align-items:center;gap:11px;padding:8px 4px 0 14px}
.card-head .ico{width:26px;height:26px;flex:none}
.card-head h2{margin:0;font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.02em;flex:1;line-height:1}
.dots{width:44px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:none}
.dots svg{width:22px;height:6px}
.dots:active{background:rgba(255,255,255,.08)}
.card-meta{flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:11px;color:var(--muted);font-family:var(--sans);letter-spacing:.04em;min-height:16px}
.card-meta .lg{display:inline-flex;align-items:center;gap:5px}
.card-meta .lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.card-meta .per{margin-left:auto}
.goal-lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#E5BB67;font-family:var(--sans);letter-spacing:.04em;margin-right:6px}
.goal-lg b{font-weight:400}
.goal-lg i{width:14px;height:0;border-top:1.5px dashed #E5BB67;display:inline-block}
.card-head .per{font-size:11px;color:var(--muted);font-family:var(--sans);letter-spacing:.04em;margin-right:-4px}
.card-body{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;text-align:left;padding:2px 10px 8px}
.card-body>.chart{flex:1;min-height:0;overflow:hidden}
.card-body:active{background:rgba(255,255,255,.03)}
.chart{width:100%;display:block;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.zreset{position:absolute;top:0;right:4px;min-height:28px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:rgba(11,52,96,.9);font-family:var(--ja);font-size:11px;color:var(--text);letter-spacing:.06em}
.card{cursor:pointer}
#v-home.active,.zoom-host,.zoom-host .chart{touch-action:none}
.zoom-host{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chart svg{display:block;width:100%;overflow:visible}
.empty{display:flex;align-items:center;justify-content:center;height:100%;min-height:60px;color:var(--muted);font-size:13px;letter-spacing:.06em}
.notes-prev{padding:2px 4px 0;display:flex;flex-direction:column;gap:0}
.np{display:flex;gap:12px;padding:6px 6px;border-radius:10px;align-items:flex-start}
.np .d{flex:none;width:44px;font-family:var(--sans);font-size:12px;color:var(--muted);padding-top:2px}
.np .t{flex:1;min-width:0;font-size:14px;line-height:1.6;overflow-wrap:anywhere;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.np .t{padding-right:52px}
.np-more{font-size:11px;color:var(--muted);padding:2px 6px 0}

.fab{
  position:fixed;z-index:20;
  right:max(18px, calc((100vw - 520px)/2 + 18px));
  bottom:calc(var(--safe-b) + 10px);
  width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(120,175,225,.55),rgba(20,70,125,.92) 70%);
  border:1px solid rgba(180,220,250,.7);
  box-shadow:0 6px 22px rgba(0,20,50,.45);
  display:flex;align-items:center;justify-content:center;
}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.96)}

/* ---------- Sub pages ---------- */
.page{min-height:100%;padding:calc(var(--safe-t) + 6px) var(--pad) calc(var(--safe-b) + 40px)}
.topbar{display:flex;align-items:center;gap:4px;height:52px;margin:0 -6px 6px}
.topbar .back{display:flex;align-items:center;gap:2px;height:44px;min-width:44px;padding:0 8px 0 4px;border-radius:12px;color:var(--text);font-size:15px}
.topbar .back svg{width:22px;height:22px}
.topbar h1{flex:1;margin:0;font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1.ja{font-family:var(--ja);font-size:16px;font-weight:600;letter-spacing:.04em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px}
.list{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line-soft);min-height:52px}
.row:first-child{border-top:0}
.row:active{background:rgba(255,255,255,.05)}
.row .d{flex:none;width:58px;font-family:var(--sans);font-size:14px;color:var(--text)}
.row .d small{display:block;font-size:10px;color:var(--muted)}
.row .v{flex:1;display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--sans);font-size:15px;min-width:0}
.row .v .p{color:var(--private)}
.row .v .w{color:var(--work)}
.row .v .off{color:var(--muted);font-family:var(--ja);font-size:12px}
.row .v .s{color:var(--sleep)}
.row .chev{flex:none;opacity:.4;width:16px;height:16px}
.row.note{align-items:flex-start}
.row.note .t{flex:1;min-width:0;font-size:14px;line-height:1.7;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}
.row.note .d{padding-top:2px}
.list-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.filter-label{font-size:12px;color:var(--muted);font-family:var(--sans);letter-spacing:.04em;margin:2px 4px 0}

/* ---------- Day page ---------- */
.day-date{font-family:var(--sans);font-weight:300;font-size:30px;letter-spacing:.04em;margin:4px 2px 2px}
.day-date small{font-family:var(--ja);font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:.05em}
.day-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:12px}
.day-sec h3{margin:0 0 10px;font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.day-sec h3 i{width:9px;height:9px;border-radius:50%;display:inline-block}
.scale{display:flex;align-items:center;gap:14px}
.scale .track{position:relative;flex:1;height:44px}
.scale .bar{position:absolute;left:0;right:0;top:15px;height:2px;background:rgba(255,255,255,.28);border-radius:1px}
.scale .tick{position:absolute;top:10px;width:1px;height:12px;background:rgba(255,255,255,.45)}
.scale .tick.mid{height:16px;top:8px;background:rgba(255,255,255,.7)}
.scale .lab{position:absolute;top:28px;font-family:var(--sans);font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.scale .lab.l{transform:none}
.scale .lab.r{transform:translateX(-100%)}
.scale .pt{position:absolute;top:16px;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(11,52,96,.9)}
.scale .val{flex:none;width:64px;text-align:right;font-family:var(--sans);font-weight:300;font-size:34px;line-height:1}
.offtxt{color:var(--muted);font-size:15px;padding:6px 0 4px;letter-spacing:.06em}
.sleep-big{font-family:var(--sans);font-weight:300;font-size:40px;color:var(--sleep);letter-spacing:.02em;line-height:1.1}
.note-full{font-size:15px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.note-none{color:var(--faint);font-size:13px;letter-spacing:.06em}
.daynav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.daynav button{min-height:46px;padding:0 16px;border-radius:23px;border:1px solid var(--line);background:rgba(11,52,96,.55);font-family:var(--sans);font-size:15px;display:flex;align-items:center;gap:6px}
.daynav button[disabled]{opacity:.25;pointer-events:none}
.daynav svg{width:16px;height:16px}

/* ---------- Entry flow ---------- */
.entry{display:flex;flex-direction:column;min-height:100%;padding:calc(var(--safe-t) + 6px) 20px calc(var(--safe-b) + 22px)}
.entry .topbar{margin-bottom:0}
.steps{display:flex;gap:6px;justify-content:center;flex:1}
.steps button{font-family:var(--sans);font-size:12px;letter-spacing:.06em;color:var(--faint);padding:8px 6px;min-height:36px;border-radius:10px;pointer-events:none}
.steps.jump button{pointer-events:auto}
.steps button.on{color:var(--text)}
.steps button.done{color:var(--muted)}
.entry-date{display:flex;justify-content:center;margin-top:2px}
.datepick{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:rgba(11,52,96,.45);font-family:var(--sans);font-size:15px;letter-spacing:.06em;color:var(--text)}
.datepick svg{width:15px;height:15px;opacity:.75;flex:none}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none;cursor:pointer}
.datefixed{font-family:var(--sans);font-size:14px;color:var(--muted);letter-spacing:.06em;min-height:40px;display:flex;align-items:center}
.entry-note{text-align:center;font-size:11.5px;color:var(--muted);margin-top:6px;min-height:16px}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0}
.stage h2{margin:0;text-align:center;font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:.03em}
.bigval{text-align:center;font-family:var(--sans);font-weight:300;font-size:84px;line-height:1.1;margin:18px 0 26px;font-variant-numeric:tabular-nums;min-height:92px}
.bigval.offv{font-family:var(--ja);font-size:30px;font-weight:500;line-height:92px;color:var(--muted)}
.bigval.sleepv{font-size:66px;line-height:92px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;touch-action:pan-y;--c:#fff;--p:50%}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--c) 0,var(--c) var(--p),rgba(255,255,255,.22) var(--p))}
.rng::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.22)}
.rng::-moz-range-progress{height:6px;border-radius:3px;background:var(--c)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--c);margin-top:-13px;border:3px solid #0b2f57;box-shadow:0 0 0 1px var(--c)}
.rng::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid #0b2f57}
.rng.mood{--p:50%}
.rng.dim{opacity:.35}
.rlabels{display:flex;justify-content:space-between;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:4px;padding:0 4px}
.offbtn{display:block;margin:26px auto 0;min-height:44px;padding:0 22px;border-radius:22px;border:1px solid var(--line);font-size:14px;color:var(--muted);letter-spacing:.06em}
.offbtn.on{border-color:var(--work);color:#0b2f57;background:var(--work);font-weight:600}
textarea.note{width:100%;min-height:180px;resize:vertical;margin-top:20px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(11,52,96,.7);color:var(--text);font:inherit;font-size:16px;line-height:1.7}
textarea.note::placeholder{color:var(--faint)}
.primary{display:block;width:100%;min-height:56px;border-radius:28px;background:#fff;color:#0b2f57;font-weight:600;font-size:17px;letter-spacing:.12em}
.primary:active{opacity:.85}

/* ---------- Settings ---------- */
.set-sec{margin-top:14px}
.set-btn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;padding:0 18px;border-top:1px solid var(--line-soft);font-size:15px;text-align:left}
.set-btn:first-child{border-top:0}
.set-note{font-size:12px;color:var(--muted);line-height:1.8;margin:12px 6px 0}
.set-ver{text-align:center;margin-top:30px;font-family:var(--sans);font-size:12px;color:var(--faint);letter-spacing:.1em}

/* ---------- Sheets & dialogs ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(2,14,30,.55);display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.scrim.show{display:flex}
.scrim.vis{opacity:1}
.sheet{width:100%;max-width:520px;background:#0e3a66;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:10px 12px calc(var(--safe-b) + 14px);max-height:80vh;overflow:auto;transform:translateY(20px);transition:transform .2s}
.scrim.vis .sheet{transform:none}
.sheet .grip{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 8px}
.sheet h4{margin:4px 8px 8px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;padding:0 14px;border-radius:12px;font-size:15px;text-align:left}
.opt:active{background:rgba(255,255,255,.06)}
.opt.sel{color:var(--gold)}
.opt.sel::after{content:"✓";font-size:15px}
.opt.danger{color:var(--danger)}
.opt[disabled]{opacity:.32;pointer-events:none}
.opt small{font-size:11px;color:var(--muted);margin-left:auto;letter-spacing:.04em}
.yrs{display:flex;flex-direction:column;gap:6px}
.yr{border-top:1px solid var(--line-soft);padding-top:6px}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 6px 8px}
.months button{min-height:42px;border-radius:10px;border:1px solid var(--line-soft);font-family:var(--sans);font-size:14px}
.months button.sel{border-color:var(--gold);color:var(--gold)}
.months button[disabled]{opacity:.2}
.sheet .cancel{margin-top:6px;justify-content:center;color:var(--muted)}
.scrim.center{align-items:center;padding:20px}
.dialog{width:100%;max-width:340px;background:#0e3a66;border:1px solid var(--line);border-radius:20px;padding:22px 20px 16px;transform:scale(.97);transition:transform .18s}
.scrim.vis .dialog{transform:none}
.dialog h5{margin:0 0 10px;font-size:16px;font-weight:600;line-height:1.6}
.dialog p{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.75}
.dialog .btns{display:flex;gap:10px}
.dialog .btns button{flex:1;min-height:48px;border-radius:24px;border:1px solid var(--line);font-size:15px}
.dialog .btns .go{background:#fff;color:#0b2f57;border-color:#fff;font-weight:600}
.dialog .btns .go.danger{background:var(--danger);border-color:var(--danger);color:#3a0d0d}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 100px);transform:translateX(-50%);z-index:60;background:rgba(255,255,255,.95);color:#0b2f57;font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

        </div>
        <div class="card-meta">

                <div class="card-body"><div class="chart" id="chSleep"></div></div>

    </div>

    <button class="fab" id="fab" aria-label="今日の記録">

  <!-- MOOD DETAIL -->
  <section class="view" id="v-mood">

        <h1>Mood</h1>
        <button class="dots" data-menu="mood" aria-label="表示期間"><svg viewBox="0 0 22 6" fill="#E5BB67"><circle cx="3" cy="3" r="2.4"/><circle cx="11" cy="3" r="2.4"/><circle cx="19" cy="3" r="2.4"/></svg></button>

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dayNum = s => { const [y, m, d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const md = s => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sgn = v => v > 0 ? `+${v}` : v < 0 ? `−${Math.abs(v)}` : "0";
const fmtSleep = h => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); return `${hh}h ${pad2(mm)}m`; };

/* ================= 保存 ================= */
let storageOK = true;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { storageOK = false; return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { storageOK = false; return false; } }

function validRecord(r) {
  if (!r || typeof r !== "object") return false;
  if (typeof r.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(r.date)) return false;
  const d = parseYmd(r.date); if (isNaN(d) || ymd(d) !== r.date) return false;
  if (!Number.isInteger(r.privateMood) || r.privateMood < -10 || r.privateMood > 10) return false;
  if (typeof r.workOff !== "boolean") return false;
  if (r.workOff) { if (r.workMood !== null && r.workMood !== undefined) return false; }
  else if (!Number.isInteger(r.workMood) || r.workMood < -10 || r.workMood > 10) return false;
  if (typeof r.sleep !== "number" || r.sleep < 0 || r.sleep > 15 || Math.round(r.sleep * 2) !== r.sleep * 2) return false;
  if (r.note !== undefined && r.note !== null && typeof r.note !== "string") return false;
  return true;
}
function normRecord(r) {
  return {
    date: r.date,
    timestamp: typeof r.timestamp === "string" ? r.timestamp : new Date().toISOString(),
    privateMood: r.privateMood,
    workMood: r.workOff ? null : r.workMood,
    workOff: r.workOff,
    sleep: r.sleep,
    note: typeof r.note === "string" ? r.note : "",
    updatedAt: typeof r.updatedAt === "string" ? r.updatedAt : new Date().toISOString()
  };
}
/* 将来のデータ形式変更はここで移行する（既存データは消さない） */
function migrate(obj) {
  if (!obj || typeof obj !== "object") return null;
  let recs = obj.records;
  if (recs && !Array.isArray(recs) && typeof recs === "object") recs = Object.values(recs);
  if (!Array.isArray(recs)) return null;
  return { schemaVersion: SCHEMA_VERSION, records: recs };
}

const DB = {
  map: new Map(),
  load() {
    const raw = lsGet(STORE_KEY);
    if (!raw) return;
    try {
      const m = migrate(JSON.parse(raw));
      if (!m) { lsSet(STORE_KEY + ".corrupt." + Date.now(), raw); return; }
      for (const r of m.records) if (validRecord(r)) this.map.set(r.date, normRecord(r));
    } catch (e) {
      lsSet(STORE_KEY + ".corrupt." + Date.now(), raw); // 壊れていても元データは別名で残す
    }
  },
  persist() {
    const data = { app: "NAGI", schemaVersion: SCHEMA_VERSION, savedAt: new Date().toISOString(), records: this.all() };
    return lsSet(STORE_KEY, JSON.stringify(data));
  },
  all() { return [...this.map.values()].sort((a, b) => a.date < b.date ? -1 : 1); },
  get(d) { return this.map.get(d) || null; },
  put(rec) { this.map.set(rec.date, rec); return this.persist(); },
  del(d) { this.map.delete(d); return this.persist(); },
  replaceAll(recs) { this.map = new Map(recs.map(r => [r.date, r])); return this.persist(); }
};

const prefs = { moodPeriod: "all", sleepPeriod: "all", notesFilter: { y: null, m: null } };
function loadPrefs() { try { const p = JSON.parse(lsGet(PREF_KEY) || "null"); if (p) { if (p.notesFilter && typeof p.notesFilter === "object") prefs.notesFilter = { y: Number.isInteger(p.notesFilter.y) ? p.notesFilter.y : null, m: Number.isInteger(p.notesFilter.m) ? p.notesFilter.m : null }; } } catch (e) { } }
function savePrefs() { lsSet(PREF_KEY, JSON.stringify(prefs)); }

/* ================= 期間・絞り込み ================= */
const PERIODS = { all: { label: "全期間", m: 0 }, "1y": { label: "1年", m: 12 }, "6m": { label: "6か月", m: 6 }, "3m": { label: "3か月", m: 3 }, "1m": { label: "1か月", m: 1 } };
function periodStart(key) {
  const p = PERIODS[key]; if (!p || !p.m) return null;
  const d = new Date(); d.setHours(0, 0, 0, 0); d.setMonth(d.getMonth() - p.m); return ymd(d);
}
function periodRange(key, recs) {
  const s = periodStart(key), today = dayNum(todayStr());
  if (s) return { start: dayNum(s), end: today };
  return recs.length ? { start: dayNum(recs[0].date), end: today } : null;
}
// その期間ぶんの記録がたまっているか（最初の記録が期間の始まり以前にある）
function periodAvailable(key) {
  const s = periodStart(key); if (!s) return true;
  const all = DB.all(); return all.length > 0 && all[0].date <= s;
}
function inPeriod(key) { const s = periodStart(key); return DB.all().filter(r => !s || r.date >= s); }
function notesFiltered() {
  const { y, m } = prefs.notesFilter;
  return DB.all().filter(r => r.note && r.note.trim()).filter(r => {
    const d = parseYmd(r.date);
    if (y && d.getFullYear() !== y) return false;
    if (y && m && d.getMonth() + 1 !== m) return false;
    return true;
  }).reverse();
}
function notesFilterLabel() { const { y, m } = prefs.notesFilter; return !y ? "すべて" : m ? `${y}年${m}月` : `${y}年`; }

function renderQuote() {
  const n = QUOTES.length;
  const i = (((dayNum(todayStr()) - dayNum(QUOTE_ANCHOR)) % n) + n) % n;
  const q = QUOTES[i]; const el = $("#quote");
  el.textContent = q;

}
$("#quote").addEventListener("click", () => {

});

/* ================= グラフ ================= */
function chartGeom(el, h) { const w = Math.max(240, Math.floor(el.clientWidth || el.parentElement.clientWidth || 320)); return { w, h }; }
/* opts: {kind:'mood'|'sleep', recs, height, big} */
function drawChart(el, opts) {
  el._opts = opts;
  const recs = opts.recs;
  el._pts = [];
  if (!recs.length) { el._span = 0; el.innerHTML = `<div class="empty" style="height:${opts.height}px">まだ記録がありません</div>`; return; }
  const { w, h } = chartGeom(el, opts.height);
  const L = opts.kind === "mood" ? 30 : 34, R = 12, T = 14, B = 24;
  const iw = w - L - R, ih = h - T - B;
  // 横軸の範囲：期間を選んでいるときは「その期間の始まり〜今日」、全期間は「最初の記録〜今日」
  const rg = opts.range || {};
  const d0 = rg.start != null ? Math.min(rg.start, dayNum(recs[0].date)) : dayNum(recs[0].date);
  const d1 = rg.end != null ? Math.max(rg.end, dayNum(recs[recs.length - 1].date)) : dayNum(recs[recs.length - 1].date);
  const span = d1 - d0;
  // 拡大表示中の範囲（全体を0〜1とした割合）
  const v = (el._view && span > 0) ? el._view : { a: 0, b: 1 };
  const vs = d0 + v.a * span, ve = d0 + v.b * span, vspan = ve - vs;
  const zoomed = span > 0 && (v.b - v.a) < 0.999;
  el._span = span; el._geo = { L, iw, w };
  const X = s => span === 0 ? L + iw / 2 : L + (dayNum(s) - vs) / vspan * iw;
  let yMin, yMax;
  if (opts.kind === "mood") { yMin = -10; yMax = 10; }
  else {
    const mx = Math.max(...recs.map(r => r.sleep)), mn = Math.min(...recs.map(r => r.sleep));
    yMin = Math.max(0, Math.floor(mn) - 1); yMax = Math.min(15, Math.ceil(mx) + 1);
    yMin = Math.min(yMin, SLEEP_GOAL - 1); yMax = Math.max(yMax, SLEEP_GOAL + 1); // 目標線が必ず見えるように
    if (yMax - yMin < 4) { yMax = Math.min(15, yMin + 4); yMin = Math.max(0, yMax - 4); }
  }
  const Y = v => T + (yMax - v) / (yMax - yMin) * ih;
  const vis = recs.filter(r => { const dn = dayNum(r.date); return dn >= vs - 1e-6 && dn <= ve + 1e-6; });
  const n = vis.length, density = n / Math.max(1, iw);
  const r = n <= 1 ? 4.5 : density < .04 ? 3 : density < .1 ? 2.4 : density < .25 ? 1.8 : 1.3;
  const sw = density < .25 ? 1.2 : 1;
  const cid = "clip-" + el.id;
  let s = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${opts.kind === "mood" ? "Moodの推移" : "Sleepの推移"}"><defs><clipPath id="${cid}"><rect x="${L - 6}" y="0" width="${iw + 12}" height="${h}"/></clipPath></defs>`;
  // grid
  const maxTicks = Math.max(2, Math.floor(ih / 15) + 1);
  const gl = opts.kind === "mood" ? (ih < 70 ? [10, 0, -10] : [10, 5, 0, -5, -10]) : (() => { const a = []; const st = [1, 2].find(st => Math.floor((yMax - yMin) / st) + 1 <= maxTicks) || 2; for (let v = Math.ceil(yMin / st) * st; v <= yMax; v += st) a.push(v); return a; })();
  for (const v of gl) {
    const y = Y(v).toFixed(1);
    const zero = opts.kind === "mood" && v === 0;
    s += `<line x1="${L}" x2="${w - R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,${zero ? .5 : .1})" stroke-width="1" ${zero ? "" : 'stroke-dasharray="2 4"'}/>`;
    const lab = opts.kind === "mood" ? (v === 0 ? "0" : (v > 0 ? "+" : "−") + Math.abs(v)) : v + "h";
    const isGoal = opts.kind === "sleep" && v === SLEEP_GOAL;
    if (opts.kind !== "mood" || v % 10 === 0 || opts.big) s += `<text x="${L - 6}" y="${(+y + 3.5).toFixed(1)}" text-anchor="end" font-size="10" font-family="Jost,sans-serif" ${isGoal ? 'fill="#E5BB67" font-weight="500"' : 'fill="rgba(255,255,255,.55)"'}>${lab}</text>`;
  }
  if (opts.kind === "sleep") {
    const gy = Y(SLEEP_GOAL).toFixed(1);
    s += `<line x1="${L}" x2="${w - R}" y1="${gy}" y2="${gy}" stroke="#E5BB67" stroke-width="1.2" stroke-dasharray="5 4"/>`;
  }
  // x labels（表示中の範囲に合わせる）
  const maxLab = Math.max(2, Math.floor(iw / 58));
  const labDates = [];
  const dnStr = dn => { const dt = new Date(Date.UTC(1970, 0, 1) + dn * 864e5); return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`; };
  let monthMode = false;
  if (span === 0) labDates.push(recs[0].date);
  else if (vspan > 62) {
    // 長い期間は「月の初め」に目盛り
    monthMode = true;
    const sd = new Date(Date.UTC(1970, 0, 1) + Math.ceil(vs) * 864e5);
    let y = sd.getUTCFullYear(), m = sd.getUTCMonth();
    if (sd.getUTCDate() !== 1) m++;
    const ms = [];
    for (; ; m++) { const dn = Math.round(Date.UTC(y, m, 1) / 864e5); if (dn > ve) break; ms.push(dnStr(dn)); if (ms.length > 200) break; }
    const step = Math.max(1, Math.ceil(ms.length / maxLab));
    ms.forEach((d, i) => { if (i % step === 0) labDates.push(d); });
  }
  else if (n <= maxLab && n > 0 && !zoomed && !opts.range) vis.forEach(r => labDates.push(r.date));
  else {
    const k = Math.max(2, Math.min(maxLab, Math.floor(vspan) + 1));
    const seen = new Set();
    for (let i = 0; i < k; i++) { const dn = Math.round(vs + vspan * i / (k - 1)); if (dn < vs - 1e-6 || dn > ve + 1e-6 || seen.has(dn)) continue; seen.add(dn); labDates.push(dnStr(dn)); }
  }
  const longSpan = vspan > 300;
  labDates.forEach((ds, i) => {
    const x = X(ds); const d = parseYmd(ds);
    const t = monthMode ? (longSpan ? `${String(d.getFullYear()).slice(2)}/${d.getMonth() + 1}` : `${d.getMonth() + 1}月`) : `${d.getMonth() + 1}/${d.getDate()}`;
    const anchor = span === 0 ? "middle" : x < L + 14 ? "start" : x > L + iw - 14 ? "end" : "middle";
    s += `<text x="${x.toFixed(1)}" y="${h - 6}" text-anchor="${anchor}" font-size="10" font-family="Jost,sans-serif" fill="rgba(255,255,255,.55)">${t}</text>`;
  });
  const series = opts.kind === "mood"
    ? [{ c: "#F7CF4A", pts: recs.map(r => [r.date, r.privateMood]) }, { c: "#B4DB4E", pts: recs.filter(r => !r.workOff && r.workMood !== null).map(r => [r.date, r.workMood]) }]
    : [{ c: "#C9EBFF", pts: recs.map(r => [r.date, r.sleep]) }];
  s += `<g clip-path="url(#${cid})">`;
  for (const se of [...series].reverse()) {
    if (se.pts.length >= 2) s += `<polyline fill="none" stroke="${se.c}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" points="${se.pts.map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" ")}"/>`;
    for (const p of se.pts) { const x = X(p[0]); if (x < L - 10 || x > L + iw + 10) continue; s += `<circle cx="${x.toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${r}" fill="${se.c}"/>`; }
  }
  s += `</g><circle class="hl" r="${Math.max(r + 5, 9)}" fill="none" stroke="#fff" stroke-width="1.5" opacity="0" cx="-99" cy="-99"/>`;
  s += "</svg>";
  if (zoomed) s += `<button class="zreset" aria-label="全体表示に戻す">全体</button>`;
  el.innerHTML = s;
  el._pts = vis.map(r => ({ date: r.date, x: X(r.date), y: opts.kind === "mood" ? Y(r.privateMood) : Y(r.sleep) }));
  el._w = w;
}

/* ===== グラフの拡大（ピンチ）・移動（拡大中に横スワイプ） =====
   反応範囲：グラフだけでなく、そのカード（詳細画面ではグラフの枠）全体。
   指の片方がカードの外に出ていても、2本の指の中間点がカード上なら拡大できる。 */
const ZOOM_HOSTS = { cardMood: "chMood", cardSleep: "chSleep", panelMood: "chMoodBig", panelSleep: "chSleepBig" };

/* ===== タップ／ダブルタップ ===== */
let TAP = null;
function hostTap(host, e) {
  const el = document.getElementById(ZOOM_HOSTS[host.id]);
  if (suppressed(el)) return; // ピンチ・スワイプ直後のタップは無視
  const now = Date.now(), cx = e.clientX, cy = e.clientY, onChart = !!e.target.closest(".chart");
  if (TAP && TAP.host === host && now - TAP.t < 320 && Math.hypot(cx - TAP.x, cy - TAP.y) < 45) {
    clearTimeout(TAP.timer); TAP = null;
    doubleTapZoom(el, cx);
    return;
  }
  if (TAP) clearTimeout(TAP.timer);
  TAP = { host, t: now, x: cx, y: cy, timer: setTimeout(() => { TAP = null; singleTap(host, el, onChart, cx); }, 260) };
}
function singleTap(host, el, onChart, cx) {
  if (suppressed(el) || host.offsetParent === null) return;
  if (onChart) { const p = chartHit(el, { clientX: cx }); if (p) { flashPoint(el, p); go("day", { arg: p.date }); return; } }
  if (host.dataset.open) go(host.dataset.open);
}
function doubleTapZoom(el, clientX) {
  if (!zReady(el)) return;
  const v = zCur(el), wd = v.b - v.a, mw = zMinW(el);
  if (wd <= mw + 1e-6) { animateView(el, 0, 1); return; } // いちばん拡大しているときは全体に戻す
  const f = zFrac(el, clientX), anchor = v.a + f * wd;

}
function animateView(el, a1, w1) {

/* グラフの点タップ：見た目より広い範囲（横方向の最寄り点・最大28px）で判定 */
function chartHit(el, ev) {
  if (!el._pts || !el._pts.length) return null;
  const svg = $("svg", el); if (!svg) return null;
  const rect = svg.getBoundingClientRect();

  let best = null, bd = Infinity;
  for (const p of el._pts) { const d = Math.abs(p.x - x); if (d < bd) { bd = d; best = p; } }
  const thr = Math.max(28, Math.min(44, (el._w / el._pts.length) / 2));

function renderAll() {

/* ================= 画面遷移 ================= */
const nav = { stack: [{ name: "home" }], cur() { return this.stack[this.stack.length - 1]; } };
function show(name) {
  $$(".view").forEach(v => v.classList.toggle("active", v.id === "v-" + name));
}
function renderView(e) {
  if (e.name === "home") renderHome();
  if (e.name === "mood") renderMoodDetail();
  if (e.name === "sleep") renderSleepDetail();
  if (e.name === "notes") renderNotes();
  if (e.name === "day") renderDay(e.arg);
  if (e.name === "settings") renderSettings();
}
function go(name, { arg = null, reset = false, replace = false } = {}) {
  const e = { name, arg, scroll: 0 };
  const cur = nav.cur(); cur.scroll = window.scrollY;
  if (reset) nav.stack = [{ name: "home" }];
  if (name === "home") nav.stack = [{ name: "home" }];
  else if (replace) nav.stack[nav.stack.length - 1] = e;
  else nav.stack.push(e);
  show(name); renderView(nav.cur());
  window.scrollTo(0, 0);
}
function back() {
  if (nav.stack.length <= 1) { go("home"); return; }
  nav.stack.pop();
  const e = nav.cur(); show(e.name); renderView(e);
  requestAnimationFrame(() => window.scrollTo(0, e.scroll || 0));
}

/* ================= シート・ダイアログ ================= */
const scrim = $("#scrim");
let scrimClose = null, scrimGen = 0;
function openScrim(html, center = false, onClose = null) {
  scrimGen++;
  scrim.className = "scrim show" + (center ? " center" : "");
  scrim.innerHTML = html; scrimClose = onClose;
  requestAnimationFrame(() => scrim.classList.add("vis"));
}
function closeScrim() {
  scrim.classList.remove("vis");
  const f = scrimClose; scrimClose = null;
  const g = scrimGen;
  setTimeout(() => { if (g === scrimGen) { scrim.className = "scrim"; scrim.innerHTML = ""; } }, 180);
  if (f) f();
}
scrim.addEventListener("click", e => { if (e.target === scrim) closeScrim(); });
function sheet(title, items) {
  return new Promise(res => {
    openScrim(`<div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grip"></div><h4>${esc(title)}</h4>${items.map((it, i) => `<button class="opt ${it.sel ? "sel" : ""} ${it.danger ? "danger" : ""}" data-i="${i}" ${it.disabled ? "disabled" : ""}>${esc(it.label)}${it.note ? `<small>${esc(it.note)}</small>` : ""}</button>`).join("")}<button class="opt cancel" data-i="-1">閉じる</button></div>`, false, () => res(null));
    $$(".opt", scrim).forEach(b => b.addEventListener("click", () => { const i = +b.dataset.i; scrimClose = null; closeScrim(); res(i < 0 ? null : items[i].value); }));
  });
}
function confirmDlg({ title, body = "", ok = "OK", cancel = "キャンセル", danger = false }) {
  return new Promise(res => {
    openScrim(`<div class="dialog" role="alertdialog" aria-label="${esc(title)}"><h5>${esc(title)}</h5>${body ? `<p>${esc(body)}</p>` : ""}<div class="btns"><button data-r="0">${esc(cancel)}</button><button class="go ${danger ? "danger" : ""}" data-r="1">${esc(ok)}</button></div></div>`, true, () => res(false));
    $$(".btns button", scrim).forEach(b => b.addEventListener("click", () => { scrimClose = null; closeScrim(); res(b.dataset.r === "1"); }));
  });
}
async function periodMenu(kind) {
  const key = kind + "Period";
  const v = await sheet(`${kind === "mood" ? "Mood" : "Sleep"} の表示期間`, Object.entries(PERIODS).map(([k, p]) => { const ok = periodAvailable(k); return { label: p.label, value: k, sel: prefs[key] === k, disabled: !ok, note: ok ? "" : "記録がたまると選べます" }; }));
  if (v && v !== prefs[key]) { prefs[key] = v; savePrefs(); $$(kind === "mood" ? "#chMood,#chMoodBig" : "#chSleep,#chSleepBig").forEach(c => c._view = null); renderAll(); }
}
function notesMenu() {
  const years = {};
  DB.all().filter(r => r.note && r.note.trim()).forEach(r => { const d = parseYmd(r.date); (years[d.getFullYear()] = years[d.getFullYear()] || new Set()).add(d.getMonth() + 1); });
  const ys = Object.keys(years).map(Number).sort((a, b) => b - a);

  for (const y of ys) {

    for (let m = 1; m <= 12; m++) h += `<button data-y="${y}" data-m="${m}" class="${f.y === y && f.m === m ? "sel" : ""}" ${years[y].has(m) ? "" : "disabled"}>${m}月</button>`;

async function dayMenu() {

/* ================= 入力フロー ================= */
let E = null; // {mode, date, step, draft, initial, from}
const DEFAULT_DRAFT = () => ({ privateMood: 0, workMood: 0, workOff: false, sleep: 8, note: "" });
const recToDraft = r => ({ privateMood: r.privateMood, workMood: r.workOff ? 0 : r.workMood, workOff: r.workOff, sleep: r.sleep, note: r.note || "" });
function startEntry({ edit = false, date = todayStr(), from = "home" } = {}) {
  const existing = DB.get(date);
  const isEdit = edit || !!existing;
  const base = existing ? recToDraft(existing) : DEFAULT_DRAFT();
  // fixedDate: その日のページから編集したときは日付を変えない
  E = { isEdit, date, step: 0, draft: { ...base }, initial: JSON.stringify(base), from, viaPlus: !edit && !!existing, fixedDate: edit };
  nav.stack.push({ name: "entry" }); show("entry"); window.scrollTo(0, 0);
  renderEntry();
}
const CAL = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>';
function changeEntryDate(v) {
  if (!E || E.fixedDate || !/^\d{4}-\d{2}-\d{2}$/.test(v || "")) { if (E) renderEntry(); return; }
  if (v > todayStr()) { toast("未来の日付は選べません"); renderEntry(); return; }
  if (v === E.date) return;
  const ex = DB.get(v), wasExisting = !!DB.get(E.date);
  E.date = v; E.viaPlus = !!ex; E.isEdit = !!ex;
  if (ex) { E.draft = recToDraft(ex); E.initial = JSON.stringify(E.draft); }
  else { if (wasExisting) E.draft = DEFAULT_DRAFT(); E.initial = JSON.stringify(DEFAULT_DRAFT()); }
  renderEntry();
}
const dirty = () => E && JSON.stringify(E.draft) !== E.initial;
function setRangeFill(inp) { const p = (inp.value - inp.min) / (inp.max - inp.min) * 100; inp.style.setProperty("--p", p + "%"); }
function renderEntry() {
  const d = parseYmd(E.date);
  const dl = `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}（${WD[d.getDay()]}）`;
  const isToday = E.date === todayStr();
  if (E.fixedDate) $("#entryDate").innerHTML = `<span class="datefixed">${dl}</span>`;
  else {
    $("#entryDate").innerHTML = `<label class="datepick">${CAL}<span>${dl}</span><input type="date" id="dateIn" value="${E.date}" max="${todayStr()}" aria-label="記録する日付を選ぶ"></label>`;
    $("#dateIn").addEventListener("change", e => changeEntryDate(e.target.value));
  }
  $("#entryNote").textContent = E.fixedDate ? "記録を編集中" : E.isEdit ? `${isToday ? "今日" : "この日"}の記録はすでにあります。内容を編集できます` : (isToday ? "" : "この日の記録を追加します");
  $("#steps").classList.toggle("jump", E.isEdit);
  $$("#steps button").forEach((b, i) => { b.classList.toggle("on", i === E.step); b.classList.toggle("done", i < E.step); });
  $("#entryBack").innerHTML = E.step === 0 ? ICON.close : ICON.back;
  $("#entryBack").setAttribute("aria-label", E.step === 0 ? "閉じる" : "前へ");
  const st = $("#stage"), D = E.draft;
  const go = $("#entryGo");
  go.textContent = E.step < 3 ? "決定" : (E.isEdit ? "変更を保存" : "保存");
  if (E.step === 0 || E.step === 1) {
    const isW = E.step === 1, key = isW ? "workMood" : "privateMood", col = isW ? "#B4DB4E" : "#F7CF4A";
    const off = isW && D.workOff;
    st.innerHTML = `<h2 style="color:${col}">${isW ? "Work" : "Private"}</h2>
      <div class="bigval ${off ? "offv" : ""}" id="bv" style="color:${off ? "" : col}">${off ? "仕事なし" : sgn(D[key])}</div>
      <input type="range" class="rng ${off ? "dim" : ""}" id="rng" min="-10" max="10" step="1" value="${D[key]}" style="--c:${col}" aria-label="${isW ? "Work" : "Private"} Mood">
      <div class="rlabels"><span>−10</span><span>0</span><span>+10</span></div>
      ${isW ? `<button class="offbtn ${off ? "on" : ""}" id="offBtn" aria-pressed="${off}">今日は仕事なし</button>` : ""}`;
    const rng = $("#rng"); setRangeFill(rng);
    const upd = () => {
      D[key] = +rng.value; setRangeFill(rng);
      if (isW && D.workOff) { D.workOff = false; rng.classList.remove("dim"); const ob = $("#offBtn"); ob.classList.remove("on"); ob.setAttribute("aria-pressed", "false"); }
      const bv = $("#bv"); bv.className = "bigval"; bv.style.color = col; bv.textContent = sgn(D[key]);
    };
    rng.addEventListener("input", upd);
    rng.addEventListener("pointerdown", () => { if (isW && D.workOff) upd(); });
    if (isW) $("#offBtn").addEventListener("click", () => {
      D.workOff = !D.workOff;
      const ob = $("#offBtn"), bv = $("#bv");
      ob.classList.toggle("on", D.workOff); ob.setAttribute("aria-pressed", String(D.workOff));
      rng.classList.toggle("dim", D.workOff);
      if (D.workOff) { bv.className = "bigval offv"; bv.style.color = ""; bv.textContent = "仕事なし"; }
      else { bv.className = "bigval"; bv.style.color = col; bv.textContent = sgn(D.workMood); }
    });
  } else if (E.step === 2) {
    st.innerHTML = `<h2 style="color:var(--sleep)">Sleep</h2>
      <div class="bigval sleepv" id="bv" style="color:var(--sleep)">${fmtSleep(D.sleep)}</div>
      <input type="range" class="rng" id="rng" min="0" max="15" step="0.5" value="${D.sleep}" style="--c:#C9EBFF" aria-label="睡眠時間">
      <div class="rlabels"><span>0h</span><span>5h</span><span>10h</span><span>15h</span></div>`;
    const rng = $("#rng"); setRangeFill(rng);
    rng.addEventListener("input", () => { D.sleep = +rng.value; setRangeFill(rng); $("#bv").textContent = fmtSleep(D.sleep); });
  } else {
    st.innerHTML = `<h2>Notes</h2><textarea class="note" id="noteIn" placeholder="何か残しておきたいことがあれば…" aria-label="メモ"></textarea>`;
    const ta = $("#noteIn"); ta.value = D.note;
    ta.addEventListener("input", () => { D.note = ta.value; });
  }
}
async function entryCancel() {
  if (dirty()) {
    const ok = await confirmDlg({ title: "入力内容を破棄して戻りますか？", ok: "破棄する", cancel: "入力を続ける" });
    if (!ok) return;
  }
  E = null; back();
}
function entrySave() {
  const D = E.draft, now = new Date().toISOString();
  const ex = DB.get(E.date);
  const rec = normRecord({
    date: E.date,
    timestamp: ex ? ex.timestamp : now,
    privateMood: D.privateMood,
    workOff: D.workOff,
    workMood: D.workOff ? null : D.workMood,
    sleep: D.sleep,
    note: D.note.replace(/\s+$/, ""),
    updatedAt: now
  });
  if (!validRecord(rec)) { toast("保存できませんでした"); return; }
  const ok = DB.put(rec);
  const wasEdit = E.isEdit, from = E.from, date = E.date;
  E = null;
  nav.stack.pop(); // entry を閉じる
  if (from === "day") { const e = nav.cur(); if (e.name === "day") { e.arg = date; show("day"); renderView(e); window.scrollTo(0, 0); } else go("day", { arg: date }); }
  else go("home", { reset: true });
  toast(ok ? (wasEdit ? "変更を保存しました" : "保存しました") : "この端末に保存できませんでした");
}
$("#entryBack").addEventListener("click", () => { if (!E) return; if (E.step === 0) entryCancel(); else { E.step--; renderEntry(); } });
$("#entryGo").addEventListener("click", () => { if (!E) return; if (E.step < 3) { E.step++; renderEntry(); } else entrySave(); });
$$("#steps button").forEach(b => b.addEventListener("click", () => { if (E && E.isEdit) { E.step = +b.dataset.step; renderEntry(); } }));

/* ================= 設定・バックアップ ================= */
function renderSettings() {
  $("#storageInfo").textContent = storageOK ? `保存されている記録：${DB.map.size}日分` : "この環境ではブラウザ保存が使えないため、再読み込みすると記録が消えます。";
}
$("#btnExport").addEventListener("click", () => {
  const data = { app: "NAGI", schemaVersion: SCHEMA_VERSION, appVersion: VERSION, exportedAt: new Date().toISOString(), records: DB.all() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `nagi_backup_${todayStr().replace(/-/g, "")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("バックアップを書き出しました");
});
$("#btnImport").addEventListener("click", () => { $("#fileIn").value = ""; $("#fileIn").click(); });
$("#fileIn").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  let obj;
  try { obj = JSON.parse(await f.text()); } catch (err) { await confirmDlg({ title: "読み込めませんでした", body: "JSON形式のバックアップファイルを選んでください。今の記録は変更していません。", ok: "OK", cancel: "閉じる" }); return; }
  const m = migrate(obj);
  const bad = !m || (obj.app && obj.app !== "NAGI") || (Number.isInteger(obj.schemaVersion) && obj.schemaVersion > SCHEMA_VERSION);
  const invalid = bad ? [] : m.records.filter(r => !validRecord(r));
  const dates = bad ? [] : m.records.map(r => r.date);
  if (bad || invalid.length || new Set(dates).size !== dates.length) {
    await confirmDlg({ title: "このファイルは読み込めません", body: "NAGIのバックアップとして正しくない内容が含まれています。今の記録は変更していません。", ok: "OK", cancel: "閉じる" });
    return;
  }
  const ok = await confirmDlg({ title: `${m.records.length}日分の記録を読み込みますか？`, body: `今この端末にある記録（${DB.map.size}日分）は、バックアップの内容に置き換わります。`, ok: "読み込む" });
  if (!ok) return;
  DB.replaceAll(m.records.map(normRecord));
  renderAll(); renderSettings(); toast("読み込みました");
});

/* ================= イベント ================= */
$("#fab").addEventListener("click", () => startEntry());
$("#btnSettings").addEventListener("click", () => go("settings"));
$$("[data-back]").forEach(b => b.addEventListener("click", back));
document.addEventListener("click", e => {
  const m = e.target.closest("[data-menu]");
  if (m) { e.stopPropagation(); const k = m.dataset.menu; if (k === "mood" || k === "sleep") periodMenu(k); else if (k === "notes") notesMenu(); else if (k === "day") dayMenu(); return; }
  const nv = e.target.closest("[data-nav]");
  if (nv && nv.dataset.nav) { go("day", { arg: nv.dataset.nav, replace: true }); return; }
  const row = e.target.closest(".row[data-date]");

  // 拡大を元に戻す（ふわっと全体へ）

  if (zr) { e.stopPropagation(); animateView(zr.closest(".chart"), 0, 1); return; }
  // カード／グラフ枠：1回タップ＝点ならその日・それ以外は詳細へ、2回タップ＝その周辺を拡大
  const host = e.target.closest(".zoom-host");
  if (host) { e.stopPropagation(); hostTap(host, e); return; }
}, true);
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open]")) { e.preventDefault(); go(e.target.dataset.open); }
  if (e.key === "Escape" && scrim.classList.contains("show")) closeScrim();
});
let rzT; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(renderAll, 120); });
// 日付が変わったら言葉を更新（開きっぱなし対策）
let lastDay = todayStr();
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayStr() !== lastDay) { lastDay = todayStr(); renderQuote(); renderAll(); } });

/* ================= デモ用サンプル（DEMO=true のときだけ使用） ================= */
function seedDemo() {
  let s = 20261002; const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const notes = ["朝の散歩が気持ちよかった", "午後から少し頭が重い。早めに寝る", "授業準備が思ったより早く終わった", "久しぶりに友達とごはん", "雨で一日ぼんやり", "週末に読みたい本を買った", "会議が長かった。帰り道の夕焼けがきれいだった", "よく眠れてすっきり", "部屋を片付けたら気分が軽くなった", "少し焦りがち。ゆっくりいく", "温かいスープを作った", "特に何もない、穏やかな日", "新しいことを一つ試せた"];
  let ni = 0; const clamp = v => Math.max(-10, Math.min(10, Math.round(v)));
  for (let i = 30; i >= 1; i--) {
    if (i === 21 || i === 9) continue; // 記録しなかった日
    const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - i);
    const wk = d.getDay() === 0 || d.getDay() === 6;
    const p = clamp(Math.sin((30 - i) / 4.2) * 5 + (rnd() - .5) * 4 + 1);
    const w = clamp(Math.cos((30 - i) / 5) * 4 + (rnd() - .5) * 4);
    const sl = Math.round(((wk ? 7.5 : 6.3) + rnd() * 1.8 - (p < -3 ? 1 : 0)) * 2) / 2;
    const note = rnd() < .45 ? notes[ni++ % notes.length] : "";
    const iso = d.toISOString();
    DB.map.set(ymd(d), normRecord({ date: ymd(d), timestamp: iso, privateMood: p, workOff: wk, workMood: wk ? null : w, sleep: Math.min(15, Math.max(0, sl)), note, updatedAt: iso }));
  }
  DB.persist();
}
